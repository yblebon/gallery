<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Photo Vault</title>

    <!-- PWA essentials -->
    <meta name="theme-color" content="#238636">
    <meta name="background-color" content="#f9f9f9">
    <meta name="description" content="Secure offline password-protected photo gallery. Encrypt and view photos locally.">

    <!-- Manifest as data URL (single-file) -->
    <link rel="manifest" href="data:application/manifest+json,{
      &quot;name&quot;: &quot;Offline Photo Vault&quot;,
      &quot;short_name&quot;: &quot;PhotoVault&quot;,
      &quot;description&quot;: &quot;Password-protected offline photo gallery&quot;,
      &quot;start_url&quot;: &quot;./&quot;,
      &quot;display&quot;: &quot;standalone&quot;,
      &quot;background_color&quot;: &quot;#f9f9f9&quot;,
      &quot;theme_color&quot;: &quot;#238636&quot;,
      &quot;icons&quot;: [
        {
          &quot;src&quot;: &quot;data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' fill='%23238636'/%&gt;&lt;text x='50' y='65' font-size='60' text-anchor='middle' fill='white'&gt;📷&lt;/text&gt;&lt;/svg&gt;&quot;,
          &quot;sizes&quot;: &quot;192x192&quot;,
          &quot;type&quot;: &quot;image/svg+xml&quot;,
          &quot;purpose&quot;: &quot;any maskable&quot;
        },
        {
          &quot;src&quot;: &quot;data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'&gt;&lt;rect width='512' height='512' fill='%23238636'/%&gt;&lt;text x='256' y='340' font-size='300' text-anchor='middle' fill='white'&gt;📷&lt;/text&gt;&lt;/svg&gt;&quot;,
          &quot;sizes&quot;: &quot;512x512&quot;,
          &quot;type&quot;: &quot;image/svg+xml&quot;,
          &quot;purpose&quot;: &quot;any maskable&quot;
        }
      ]
    }">

    <!-- Lucide icons (vanilla JS) – latest stable as of Feb 2026 -->
    <script src="https://unpkg.com/lucide@0.564.0/dist/umd/lucide.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>
    <script src="https://unpkg.com/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        body { font-family: system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        h1, h2 { color: #111; }
        section { margin: 2rem 0; padding: 1.5rem; border: 1px solid #ddd; border-radius: 10px; background: #f9f9f9; }
        .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        input, button, label, select { padding: 10px; font-size: 1rem; border-radius: 6px; }
        button { background: #238636; color: white; border: none; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        button:hover { background: #2ea043; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        button.danger { background: #c94a4a; }
        button.danger:hover { background: #b33d3d; }
        #searchInput { flex: 1 1 300px; min-width: 220px; border: 1px solid #ccc; padding-left: 36px !important; }
        #sortSelect { min-width: 160px; }
        #gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
            gap: 16px; 
            margin-top: 1.5rem; 
        }
        .gallery-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
        }
        .gallery-item img { 
            width: 100%; 
            height: auto; 
            display: block;
            aspect-ratio: 4/3;
            object-fit: cover;
            flex: 1;
        }
        .gallery-item .caption {
            padding: 8px 4px;
            font-size: 0.85rem;
            color: #333;
            text-align: center;
            width: 100%;
            background: rgba(255,255,255,0.9);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        .gallery-item .caption.editing {
            background: #fffacd;
            white-space: normal;
            overflow: visible;
            padding: 6px;
            cursor: text;
        }
        .gallery-item .caption input {
            width: 100%;
            padding: 4px;
            font-size: 0.85rem;
            border: 1px solid #999;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .select-checkbox {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            accent-color: #238636;
            cursor: pointer;
            opacity: 0.9;
            z-index: 2;
        }
        .select-mode .select-checkbox { opacity: 1; }
        #status { color: #444; font-weight: 500; min-height: 1.4rem; margin-top: 8px; }
        .note { font-size: 0.92rem; color: #555; margin: 8px 0; }
        #noResults {
            grid-column: 1 / -1;
            text-align: center;
            padding: 2rem;
            color: #777;
            font-style: italic;
        }
        i { width: 20px; height: 20px; stroke-width: 2.2; flex-shrink: 0; }
        button svg, label i { width: 20px; height: 20px; }
        .search-wrapper { position: relative; flex: 1 1 300px; min-width: 220px; }
        .search-wrapper i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #666; pointer-events: none; }
    </style>
</head>
<body>

    <h1>Offline Photo Vault</h1>

    <section>
        <h2>1. Gallery Management</h2>
        <div class="controls">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                <i data-lucide="folder-open"></i> Load Gallery
                <input type="file" id="loadGalleryFile" accept=".enc.json" style="display:none;">
            </label>
            <button onclick="initializeNewGallery()"><i data-lucide="plus-circle"></i> New Empty Gallery</button>
            <button id="downloadBtn" disabled onclick="downloadEncryptedGallery()"><i data-lucide="download"></i> Download Gallery</button>
            <button id="changePwBtn" disabled onclick="changePassword()"><i data-lucide="lock"></i> Change Password</button>
            <button onclick="closeGallery()"><i data-lucide="x-circle"></i> Close Gallery</button>
        </div>
        <div id="galleryStatus" class="note"></div>
    </section>

    <section>
        <h2>2. Add Photos</h2>
        <div class="controls">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                <i data-lucide="image-plus"></i> Choose Photos
                <input type="file" id="files" multiple accept="image/*" style="display:none;">
            </label>
            <button onclick="addPhotos()" id="addBtn" disabled><i data-lucide="plus"></i> Add Photos</button>
        </div>
        <div id="status"></div>
    </section>

    <section>
        <h2>Your Photos</h2>
        <div class="controls" style="margin-bottom: 1rem; gap: 16px; flex-wrap: wrap;">
            <div class="search-wrapper">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" placeholder="Search by filename..." disabled>
            </div>
            <select id="sortSelect" disabled>
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="name-asc">Name A–Z</option>
                <option value="name-desc">Name Z–A</option>
            </select>
            <button id="toggleSelectBtn" disabled onclick="toggleSelectMode()"><i data-lucide="square-check"></i> Select Images</button>
            <button id="selectAllBtn"   disabled onclick="selectAll(true)"><i data-lucide="check-square"></i> Select All</button>
            <button id="deselectAllBtn" disabled onclick="selectAll(false)"><i data-lucide="square"></i> Deselect All</button>
            <button id="deleteSelectedBtn" class="danger" disabled onclick="deleteSelected()"><i data-lucide="trash-2"></i> Delete Selected</button>
            <button id="downloadSelectedBtn" disabled onclick="downloadSelectedZip()"><i data-lucide="archive"></i> Download Selected (ZIP)</button>
        </div>
        <div id="gallery"></div>
    </section>

    <script>
        let currentGallery = { images: [] };
        let masterKey = null;
        let masterSalt = null;
        let selectMode = false;
        let searchTerm = "";
        let sortMode = localStorage.getItem("gallerySortMode") || "newest";

        const STATUS = document.getElementById("status");
        const GALLERY_STATUS = document.getElementById("galleryStatus");
        const DOWNLOAD_BTN = document.getElementById("downloadBtn");
        const ADD_BTN = document.getElementById("addBtn");
        const CHANGE_PW_BTN = document.getElementById("changePwBtn");
        const TOGGLE_SELECT_BTN = document.getElementById("toggleSelectBtn");
        const SELECT_ALL_BTN   = document.getElementById("selectAllBtn");
        const DESELECT_ALL_BTN = document.getElementById("deselectAllBtn");
        const DELETE_SELECTED_BTN = document.getElementById("deleteSelectedBtn");
        const DOWNLOAD_SELECTED_BTN = document.getElementById("downloadSelectedBtn");
        const SEARCH_INPUT = document.getElementById("searchInput");
        const SORT_SELECT = document.getElementById("sortSelect");

        // Lazy loading observer
        let io = null;
        if ('IntersectionObserver' in window) {
            io = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        if (img.dataset.fullSrc) {
                            img.src = img.dataset.fullSrc;
                            img.removeAttribute("data-fullSrc");
                            img.onload = () => { img.style.background = "none"; };
                        }
                        io.unobserve(img);
                    }
                });
            }, { rootMargin: "200px 0px", threshold: 0.01 });
        }

        function debounce(fn, delay = 300) {
            let timer;
            return function (...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        const debouncedRender = debounce(renderGallery);

        SORT_SELECT.value = sortMode;
        SORT_SELECT.addEventListener("change", (e) => {
            sortMode = e.target.value;
            localStorage.setItem("gallerySortMode", sortMode);
            renderGallery();
        });

        SEARCH_INPUT.addEventListener("input", () => {
            searchTerm = SEARCH_INPUT.value.trim().toLowerCase();
            debouncedRender();
        });

        window.addEventListener('beforeunload', (e) => {
            if (masterKey && currentGallery.images.length > 0) {
                e.returnValue = 'Unsaved changes will be lost!';
            }
        });

        function updateSelectionButtons() {
            const checked = document.querySelectorAll('.select-checkbox:checked').length;
            DELETE_SELECTED_BTN.disabled = checked === 0;
            DOWNLOAD_SELECTED_BTN.disabled = checked === 0;
        }

        function toggleSelectMode() {
            selectMode = !selectMode;
            document.getElementById("gallery").classList.toggle("select-mode", selectMode);
            TOGGLE_SELECT_BTN.textContent = selectMode ? "Cancel Selection" : "Select Images";
            TOGGLE_SELECT_BTN.innerHTML = selectMode ? '<i data-lucide="x"></i> Cancel' : '<i data-lucide="square-check"></i> Select Images';
            SELECT_ALL_BTN.disabled = !selectMode;
            DESELECT_ALL_BTN.disabled = !selectMode;
            updateSelectionButtons();
            renderGallery();
        }

        function selectAll(checked) {
            document.querySelectorAll('.select-checkbox').forEach(cb => cb.checked = checked);
            updateSelectionButtons();
        }

        function deleteSelected() {
            if (!confirm("Delete selected photo(s) permanently?")) return;
            const toDelete = new Set();
            document.querySelectorAll('.select-checkbox:checked').forEach(cb => {
                toDelete.add(parseInt(cb.dataset.index, 10));
            });
            currentGallery.images = currentGallery.images.filter((_, i) => !toDelete.has(i));
            renderGallery();
            toggleSelectMode();
            STATUS.textContent = `Deleted ${toDelete.size} photo(s). Remember to save the gallery.`;
        }

        async function downloadSelectedZip() {
            const checked = document.querySelectorAll('.select-checkbox:checked');
            if (!checked.length) return;
            STATUS.textContent = "Creating ZIP...";
            const zip = new JSZip();
            checked.forEach(cb => {
                const idx = parseInt(cb.dataset.index, 10);
                const img = currentGallery.images[idx];
                const binary = atob(img.base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                zip.file(img.name || `photo-${idx+1}.jpg`, bytes);
            });
            try {
                const content = await zip.generateAsync({type: "blob"});
                saveAs(content, `selected-photos-${new Date().toISOString().slice(0,10)}.zip`);
                STATUS.textContent = `Downloaded ${checked.length} photo(s) as ZIP`;
                toggleSelectMode();
            } catch (err) {
                STATUS.textContent = "";
                alert("ZIP creation failed: " + err.message);
            }
        }

        async function deriveKey(password, salt) {
            const argon = await argon2.hash({
                pass: password,
                salt,
                time: 4,
                mem: 131072,
                parallelism: 4,
                type: argon2.ArgonType.Argon2id,
                hashLen: 32
            });
            return crypto.subtle.importKey("raw", argon.hash, "AES-GCM", false, ["encrypt", "decrypt"]);
        }

        function toBase64(uint8) {
            let binary = '';
            for (let i = 0; i < uint8.byteLength; i++) binary += String.fromCharCode(uint8[i]);
            return btoa(binary);
        }

        function fromBase64(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        async function encryptData(data, key) {
            const buffer = new TextEncoder().encode(JSON.stringify(data));
            const CHUNK_SIZE = 1048576;
            const chunks = [], chunkIVs = [], chunkLengths = [];
            for (let offset = 0; offset < buffer.length; offset += CHUNK_SIZE) {
                const end = Math.min(offset + CHUNK_SIZE, buffer.length);
                const chunk = buffer.subarray(offset, end);
                const iv = crypto.getRandomValues(new Uint8Array(12));
                chunkIVs.push(iv);
                const enc = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, chunk);
                const encArr = new Uint8Array(enc);
                chunks.push(encArr);
                chunkLengths.push(encArr.length);
            }
            const combined = new Uint8Array(chunkLengths.reduce((a,b)=>a+b,0));
            let pos = 0;
            chunks.forEach(c => { combined.set(c, pos); pos += c.length; });
            return JSON.stringify({
                chunks: chunks.length,
                chunkLengths,
                chunkIVs: chunkIVs.map(toBase64),
                data: toBase64(combined)
            });
        }

        async function decryptData(jsonStr, key) {
            const payload = JSON.parse(jsonStr);
            const combined = fromBase64(payload.data);
            const chunkIVs = payload.chunkIVs.map(fromBase64);
            let offset = 0;
            const plainChunks = [];
            for (let i = 0; i < payload.chunks; i++) {
                const len = payload.chunkLengths[i];
                const cipherChunk = combined.subarray(offset, offset + len);
                offset += len;
                const dec = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: chunkIVs[i] },
                    key,
                    cipherChunk
                );
                plainChunks.push(new Uint8Array(dec));
            }
            const full = new Uint8Array(plainChunks.reduce((s,c)=>s+c.length,0));
            let pos = 0;
            plainChunks.forEach(c => { full.set(c, pos); pos += c.length; });
            return JSON.parse(new TextDecoder().decode(full));
        }

        async function initializeNewGallery() {
            const pw = prompt("Choose strong password (≥12 chars):");
            if (!pw || pw.length < 12) return alert("Password too short.");
            if (pw !== prompt("Confirm password:")) return alert("Passwords don't match.");

            masterSalt = crypto.getRandomValues(new Uint8Array(16));
            masterKey = await deriveKey(pw, masterSalt);
            currentGallery = { images: [] };

            enableGalleryControls();
            renderGallery();
            GALLERY_STATUS.textContent = "Empty gallery created. Add photos, then save.";
        }

        document.getElementById("loadGalleryFile").addEventListener("change", async e => {
            const file = e.target.files[0];
            if (!file) return;
            STATUS.textContent = "Loading...";
            const text = await file.text();
            const pw = prompt("Enter password:");
            if (!pw) return;
            try {
                const payload = JSON.parse(text);
                if (!payload.salt) throw new Error("Missing salt");
                const salt = fromBase64(payload.salt);
                masterKey = await deriveKey(pw, salt);
                masterSalt = salt;
                const { salt: _, ...cipherPart } = payload;
                currentGallery = await decryptData(JSON.stringify(cipherPart), masterKey);
                enableGalleryControls();
                SORT_SELECT.value = sortMode;
                renderGallery();
                GALLERY_STATUS.textContent = `Loaded (${currentGallery.images.length} photos)`;
                STATUS.textContent = "";
            } catch (err) {
                STATUS.textContent = "";
                alert("Load failed: " + err.message);
            }
        });

        function enableGalleryControls() {
            DOWNLOAD_BTN.disabled = false;
            ADD_BTN.disabled = false;
            CHANGE_PW_BTN.disabled = false;
            TOGGLE_SELECT_BTN.disabled = false;
            SEARCH_INPUT.disabled = false;
            SORT_SELECT.disabled = false;
        }

        async function addPhotos() {
            const files = document.getElementById("files").files;
            if (!files.length || !masterKey) return alert("No gallery or files selected.");
            STATUS.textContent = "Processing photos...";
            let added = 0;
            for (const file of files) {
                try {
                    const fullCompressed = await imageCompression(file, {
                        maxSizeMB: 0.7,
                        maxWidthOrHeight: 1600,
                        useWebWorker: true,
                        fileType: "image/jpeg",
                        initialQuality: 0.92
                    });
                    const fullBase64 = await new Promise((res, rej) => {
                        const r = new FileReader();
                        r.onload = () => res(r.result.split(',')[1]);
                        r.onerror = rej;
                        r.readAsDataURL(fullCompressed);
                    });

                    const thumbCompressed = await imageCompression(fullCompressed, {
                        maxSizeMB: 0.08,
                        maxWidthOrHeight: 320,
                        useWebWorker: true,
                        fileType: "image/jpeg",
                        initialQuality: 0.55
                    });
                    const thumbBase64 = await new Promise((res, rej) => {
                        const r = new FileReader();
                        r.onload = () => res(r.result.split(',')[1]);
                        r.onerror = rej;
                        r.readAsDataURL(thumbCompressed);
                    });

                    const name = (file.name || "photo.jpg").replace(/\.[^/.]+$/, "") + ".jpg";
                    currentGallery.images.push({
                        name,
                        searchName: name.toLowerCase(),
                        timestamp: Date.now() + Math.random(),
                        base64: fullBase64,
                        thumbBase64
                    });
                    added++;
                } catch (e) {
                    console.warn("Failed to process:", file.name, e);
                }
            }
            renderGallery();
            STATUS.textContent = added ? `${added} photo(s) added.` : "No images processed.";
            document.getElementById("files").value = "";
        }

        function startRename(caption, img, originalIndex) {
            if (caption.classList.contains("editing")) return;

            caption.classList.add("editing");
            const input = document.createElement("input");
            input.type = "text";
            input.value = img.name.replace(/\.[a-zA-Z0-9]+$/, "") || "untitled";
            input.maxLength = 120;
            input.spellcheck = false;

            caption.innerHTML = "";
            caption.appendChild(input);
            input.focus();
            input.select();

            function saveRename() {
                let newName = input.value.trim();
                if (!newName) newName = "untitled";
                newName = newName.replace(/\.[a-zA-Z0-9]+$/, "").trim() + ".webp";

                currentGallery.images[originalIndex].name = newName;
                currentGallery.images[originalIndex].searchName = newName.toLowerCase();

                renderGallery();
                STATUS.textContent = `Renamed to "${newName}". Remember to save the gallery.`;
            }

            function cancelRename() {
                renderGallery();
            }

            input.addEventListener("blur", saveRename);
            input.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    saveRename();
                } else if (e.key === "Escape") {
                    cancelRename();
                }
            });
        }

        function renderGallery() {
            const container = document.getElementById("gallery");
            container.innerHTML = "";

            let sortedImages = [...currentGallery.images];

            if (sortMode === "newest") {
                sortedImages.sort((a, b) => b.timestamp - a.timestamp);
            } else if (sortMode === "oldest") {
                sortedImages.sort((a, b) => a.timestamp - a.timestamp);
            } else if (sortMode === "name-asc") {
                sortedImages.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortMode === "name-desc") {
                sortedImages.sort((a, b) => b.name.localeCompare(a.name));
            }

            const term = searchTerm.toLowerCase();
            const filtered = sortedImages
                .map(img => ({
                    img,
                    originalIndex: currentGallery.images.indexOf(img)
                }))
                .filter(({ img }) => (img.searchName || img.name.toLowerCase()).includes(term));

            const sortLabel = {
                newest: "Newest first",
                oldest: "Oldest first",
                "name-asc": "Name A–Z",
                "name-desc": "Name Z–A"
            }[sortMode] || "Custom";

            if (filtered.length === 0) {
                if (currentGallery.images.length > 0) {
                    container.innerHTML = `<div id="noResults">No photos match "${searchTerm}"</div>`;
                } else {
                    container.innerHTML = "<p>No photos yet. Add some!</p>";
                }
            } else {
                filtered.forEach(({ img, originalIndex }) => {
                    const item = document.createElement("div");
                    item.className = "gallery-item";

                    const cb = document.createElement("input");
                    cb.type = "checkbox";
                    cb.className = "select-checkbox";
                    cb.dataset.index = originalIndex;
                    cb.addEventListener("change", updateSelectionButtons);
                    if (!selectMode) cb.style.display = "none";

                    const el = document.createElement("img");
                    el.alt = img.name;
                    el.width = 240;
                    el.height = 180;
                    el.style.aspectRatio = "4/3";
                    el.style.background = "#f0f0f0";
                    el.src = img.thumbBase64 
                        ? `data:image/jpeg;base64,${img.thumbBase64}`
                        : `data:image/jpeg;base64,${img.base64}`;
                    el.loading = "lazy";

                    if (img.thumbBase64) {
                        el.dataset.fullSrc = `data:image/jpeg;base64,${img.base64}`;
                    }

                    if (io) io.observe(el);

                    const caption = document.createElement("div");
                    caption.className = "caption";
                    caption.textContent = img.name || "Untitled";
                    caption.title = "Double-click to rename";
                    caption.addEventListener("dblclick", () => startRename(caption, img, originalIndex));

                    item.appendChild(cb);
                    item.appendChild(el);
                    item.appendChild(caption);
                    container.appendChild(item);
                });
            }

            GALLERY_STATUS.textContent = searchTerm
                ? `${filtered.length} matching photo${filtered.length !== 1 ? 's' : ''} (${sortLabel})`
                : `${currentGallery.images.length} photo${currentGallery.images.length !== 1 ? 's' : ''} (${sortLabel})`;

            if (selectMode) updateSelectionButtons();

            // Re-init Lucide icons after DOM updates
            setTimeout(() => lucide.createIcons(), 0);
        }

        async function downloadEncryptedGallery() {
            if (!masterKey) return alert("No gallery loaded");
            if (currentGallery.images.length > 40 && !confirm("Large gallery — may be slow. Continue?")) return;
            STATUS.textContent = "Encrypting...";
            try {
                const cipher = await encryptData(currentGallery, masterKey);
                const payload = JSON.parse(cipher);
                payload.salt = toBase64(masterSalt);
                downloadFile(`gallery-${new Date().toISOString().slice(0,10)}.enc.json`, JSON.stringify(payload), "application/json");
                STATUS.textContent = "Gallery saved!";
            } catch (err) {
                STATUS.textContent = "";
                alert("Download failed: " + err.message);
            }
        }

        async function changePassword() {
            if (!masterKey) return alert("No gallery loaded");
            const newPw = prompt("New password (≥12 chars):");
            if (!newPw || newPw.length < 12) return alert("Too short.");
            if (newPw !== prompt("Confirm:")) return alert("Mismatch.");
            try {
                const newSalt = crypto.getRandomValues(new Uint8Array(16));
                const newKey = await deriveKey(newPw, newSalt);
                const cipher = await encryptData(currentGallery, newKey);
                const payload = JSON.parse(cipher);
                payload.salt = toBase64(newSalt);
                downloadFile(`gallery-newpw-${new Date().toISOString().slice(0,10)}.enc.json`, JSON.stringify(payload), "application/json");
                masterKey = newKey;
                masterSalt = newSalt;
                alert("Password updated. Use the new file from now on.");
            } catch (err) {
                alert("Change failed: " + err.message);
            }
        }

        function closeGallery() {
            currentGallery = { images: [] };
            masterKey = null;
            masterSalt = null;
            selectMode = false;
            searchTerm = "";
            SEARCH_INPUT.value = "";
            if (io) io.disconnect();
            document.querySelectorAll('#gallery img').forEach(img => {
                img.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E";
                img.removeAttribute('data-fullSrc');
            });
            renderGallery();
            DOWNLOAD_BTN.disabled = ADD_BTN.disabled = CHANGE_PW_BTN.disabled = 
            TOGGLE_SELECT_BTN.disabled = SEARCH_INPUT.disabled = SORT_SELECT.disabled = true;
            SELECT_ALL_BTN.disabled = DESELECT_ALL_BTN.disabled = 
            DELETE_SELECTED_BTN.disabled = DOWNLOAD_SELECTED_BTN.disabled = true;
            STATUS.textContent = GALLERY_STATUS.textContent = "";
        }

        function downloadFile(filename, content, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Initial disable
        SEARCH_INPUT.disabled = true;
        SORT_SELECT.disabled = true;

        // ────────────────────────────────────────────────
        // Lucide icons initialization
        // ────────────────────────────────────────────────
        function initIcons() {
            lucide.createIcons();
        }

        // Call on load and after renders
        document.addEventListener('DOMContentLoaded', initIcons);

        // Override renderGallery to re-init icons
        const originalRender = renderGallery;
        renderGallery = function(...args) {
            originalRender.apply(this, args);
            setTimeout(initIcons, 50);
        };

        // ────────────────────────────────────────────────
        // PWA Service Worker (inline)
        // ────────────────────────────────────────────────
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'photovault-v1-${Date.now()}'; // bust cache on updates
                    const PRECACHE_URLS = [
                        './',
                        'https://unpkg.com/lucide@0.564.0/dist/umd/lucide.min.js',
                        'https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js',
                        'https://unpkg.com/browser-image-compression@2.0.2/dist/browser-image-compression.js',
                        'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
                        'https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js'
                    ];

                    self.addEventListener('install', e => {
                        e.waitUntil(
                            caches.open(CACHE_NAME)
                                .then(cache => cache.addAll(PRECACHE_URLS))
                                .then(() => self.skipWaiting())
                        );
                    });

                    self.addEventListener('activate', e => {
                        e.waitUntil(self.clients.claim());
                    });

                    self.addEventListener('fetch', e => {
                        if (PRECACHE_URLS.some(u => e.request.url.includes(u))) {
                            e.respondWith(
                                caches.match(e.request).then(r => r || fetch(e.request))
                            );
                        } else if (e.request.mode === 'navigate') {
                            e.respondWith(
                                fetch(e.request).catch(() => caches.match('./'))
                            );
                        }
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);

                navigator.serviceWorker.register(swUrl, { scope: './' })
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.warn('Service Worker failed', err));
            });
        }

        // Optional: capture install prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            deferredPrompt = e;
        });
    </script>
</body>
</html>
